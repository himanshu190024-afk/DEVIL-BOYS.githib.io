<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DEVIL KEY</title>
<style>
    * { box-sizing: border-box; }
    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: Arial, sans-serif;
        background:
            radial-gradient(circle at 50% 40%, #3a0000 0%, #130000 35%, #030303 75%);
        color: #fff;
        overflow: hidden;
    }
    body::before {
        content: "";
        position: fixed;
        inset: 0;
        background: repeating-linear-gradient(
            0deg,
            transparent 0px,
            transparent 3px,
            rgba(255,0,0,.025) 4px
        );
        pointer-events: none;
    }
    .box {
        width: min(90%, 430px);
        padding: 34px 25px 28px;
        text-align: center;
        background: rgba(10, 0, 0, .92);
        border: 1px solid #ff1717;
        border-radius: 18px;
        box-shadow: 0 0 15px #ff0000, 0 0 55px rgba(255,0,0,.35);
    }
    .devil {
        font-size: 55px;
        filter: drop-shadow(0 0 10px red);
        margin-bottom: 4px;
    }
    h1 {
        margin: 0 0 8px;
        color: #ff2020;
        font-size: 32px;
        letter-spacing: 5px;
        text-shadow: 0 0 10px red, 0 0 25px #900;
    }
    .sub {
        color: #aaa;
        margin-bottom: 22px;
        font-size: 13px;
        letter-spacing: 2px;
    }
    .key {
        width: 100%;
        padding: 17px 14px;
        border-radius: 10px;
        border: 1px solid #8d0000;
        background: #050505;
        color: #ff3b3b;
        font-size: 15px;
        font-weight: bold;
        letter-spacing: 1px;
        text-align: center;
        box-shadow: inset 0 0 15px rgba(255,0,0,.15);
        outline: none;
    }
    button {
        width: 100%;
        margin-top: 16px;
        padding: 15px;
        border: 0;
        border-radius: 10px;
        background: linear-gradient(135deg, #ff2424, #850000);
        color: white;
        font-size: 16px;
        font-weight: bold;
        letter-spacing: 2px;
        cursor: pointer;
        box-shadow: 0 0 15px rgba(255,0,0,.55);
        transition: .2s;
    }
    button:hover {
        transform: scale(1.02);
        box-shadow: 0 0 28px rgba(255,0,0,.8);
    }
    button:active { transform: scale(.98); }
    #msg {
        height: 20px;
        margin-top: 12px;
        color: #ff5555;
        font-size: 13px;
    }
</style>
</head>
<body>

<div class="box">
    <div class="devil">😈</div>
    <h1>DEVIL KEY</h1>
    <div class="sub">YOUR ACCESS KEY</div>

    <input
        id="key"
        class="key"
        type="text"
        value="SHJSKWJEBBDBFJOGKDBBSBEKAKDB"
        readonly
    >

    <button onclick="copyKey()">⚡ COPY KEY ⚡</button>
    <div id="msg"></div>
</div>

<script>
function copyKey() {
    const key = document.getElementById("key").value;
    navigator.clipboard.writeText(key).then(() => {
        document.getElementById("msg").textContent = "✓ KEY COPIED";
    }).catch(() => {
        const input = document.getElementById("key");
        input.select();
        document.execCommand("copy");
        document.getElementById("msg").textContent = "✓ KEY COPIED";
    });
}
</script>

</body>
</html>
