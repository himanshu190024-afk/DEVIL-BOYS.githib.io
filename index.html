<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DEVIL KEY</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
        body{min-height:100vh;display:flex;justify-content:center;align-items:center;background:#050505;color:white}
        .box{width:90%;max-width:430px;padding:35px 25px;text-align:center;background:#0d0d0d;
             border:1px solid #f00;border-radius:18px;box-shadow:0 0 15px #f00,0 0 50px rgba(255,0,0,.25)}
        .devil{font-size:55px;margin-bottom:10px}
        h1{color:#f00;font-size:30px;letter-spacing:4px;text-shadow:0 0 15px red;margin-bottom:25px}
        .key{padding:16px;background:#050505;border:1px solid #333;border-radius:10px;color:#ff3b3b;
             font-size:15px;word-break:break-all;margin-bottom:20px;box-shadow:inset 0 0 15px rgba(255,0,0,.15)}
        button{width:100%;padding:14px;border:none;border-radius:10px;background:#f00;color:white;
               font-size:17px;font-weight:bold;cursor:pointer;box-shadow:0 0 15px red;transition:.2s}
        button:hover{background:#c00;transform:scale(1.03)}
        button:active{transform:scale(.98)}
        #msg{margin-top:15px;color:#00ff66;font-size:14px;display:none}
        .footer{margin-top:25px;color:#555;font-size:12px;letter-spacing:2px}
    </style>
</head>
<body>
    <div class="box">
        <div class="devil">😈</div>
        <h1>DEVIL KEY</h1>
        <div class="key" id="key">Djskkakwjbdvgjdkskshbdbfjfk</div>
        <button onclick="copyKey()">COPY KEY</button>
        <div id="msg">✓ KEY COPIED</div>
        <div class="footer">DEVIL • ACCESS</div>
    </div>

    <script>
        function copyKey(){
            const key=document.getElementById("key").innerText.trim();
            navigator.clipboard.writeText(key).then(()=>{
                const msg=document.getElementById("msg");
                msg.style.display="block";
                setTimeout(()=>msg.style.display="none",2000);
            });
        }
    </script>
</body>
</html>
