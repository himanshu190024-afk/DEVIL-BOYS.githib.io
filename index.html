<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DEVIL KEY</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;display:flex;justify-content:center;align-items:center;background:radial-gradient(circle at center,#300000 0%,#100000 35%,#030303 75%);font-family:Arial,sans-serif;color:white;overflow:hidden}
body:before{content:"";position:fixed;inset:0;background:repeating-linear-gradient(0deg,rgba(255,0,0,.03) 0,rgba(255,0,0,.03) 1px,transparent 1px,transparent 4px);pointer-events:none}
.box{width:92%;max-width:500px;padding:35px 25px;text-align:center;background:rgba(10,0,0,.92);border:2px solid #ff1111;border-radius:20px;box-shadow:0 0 15px #f00,0 0 45px rgba(255,0,0,.5),inset 0 0 25px rgba(255,0,0,.12)}
.devil{font-size:55px;margin-bottom:8px;filter:drop-shadow(0 0 12px red)}
h1{font-size:32px;letter-spacing:6px;color:#ff2020;text-shadow:0 0 8px red,0 0 20px red;margin-bottom:8px}
.subtitle{color:#aaa;font-size:13px;letter-spacing:3px;margin-bottom:25px}
.key{padding:17px 12px;border:1px solid #ff2222;border-radius:10px;background:#080000;color:#ff4444;font-size:14px;font-weight:bold;word-break:break-all;box-shadow:inset 0 0 15px rgba(255,0,0,.15);margin-bottom:20px}
button{width:100%;padding:15px;border:none;border-radius:10px;background:linear-gradient(90deg,#7b0000,#ff1111,#7b0000);color:white;font-size:16px;font-weight:bold;letter-spacing:2px;cursor:pointer;box-shadow:0 0 15px rgba(255,0,0,.6);transition:.2s}
button:hover{transform:scale(1.03);box-shadow:0 0 30px red}
button:active{transform:scale(.97)}
#msg{height:20px;margin-top:15px;color:#ff3333;font-size:13px;font-weight:bold}
</style>
</head>
<body>
<div class="box">
<div class="devil">😈</div>
<h1>DEVIL KEY</h1>
<div class="subtitle">YOUR SECRET KEY</div>
<div class="key" id="key">DHHDJAKBDVDBJSKAKEBBDHSKWKKRBDJDKS</div>
<button onclick="copyKey()">⚡ COPY KEY ⚡</button>
<div id="msg"></div>
</div>
<script>
function copyKey(){
 const key=document.getElementById("key").innerText.trim();
 navigator.clipboard.writeText(key).then(()=>{
   document.getElementById("msg").innerText="✓ KEY COPIED!";
 }).catch(()=>{
   const temp=document.createElement("textarea");
   temp.value=key; document.body.appendChild(temp); temp.select();
   document.execCommand("copy"); temp.remove();
   document.getElementById("msg").innerText="✓ KEY COPIED!";
 });
 setTimeout(()=>document.getElementById("msg").innerText="",2000);
}
</script>
</body>
</html>
