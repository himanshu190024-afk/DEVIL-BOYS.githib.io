<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DEVIL KEY</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;display:flex;justify-content:center;align-items:center;background:#050505;font-family:Arial,sans-serif;color:#fff}
.card{width:90%;max-width:500px;padding:35px 25px;text-align:center;background:#0d0d0d;border:2px solid #8b0000;border-radius:18px;box-shadow:0 0 25px #8b0000,inset 0 0 20px #220000}
.devil{font-size:55px;margin-bottom:10px}
h1{color:#ff2222;font-size:32px;letter-spacing:5px;text-shadow:0 0 12px red;margin-bottom:25px}
.key-box{background:#050505;border:1px solid #ff2222;border-radius:10px;padding:18px 12px;margin-bottom:20px;box-shadow:0 0 12px #550000;word-break:break-all}
.key{color:#fff;font-size:17px;font-weight:bold;letter-spacing:1px}
button{border:none;padding:14px 35px;border-radius:10px;background:linear-gradient(135deg,#ff0000,#650000);color:#fff;font-size:17px;font-weight:bold;cursor:pointer;box-shadow:0 0 18px red;transition:.2s}
button:hover{transform:scale(1.06);box-shadow:0 0 30px red}
#msg{margin-top:15px;color:#ff4444;font-size:14px}
</style>
</head>
<body>
<div class="card">
<div class="devil">😈</div>
<h1>DEVIL KEY</h1>
<div class="key-box"><div class="key" id="key">HEISKANWBDVHFHIKWVRVJFKDJEB</div></div>
<button onclick="copyKey()">⚡ COPY KEY ⚡</button>
<div id="msg"></div>
</div>
<script>
function copyKey(){
 const key=document.getElementById("key").innerText.trim();
 navigator.clipboard.writeText(key).then(()=>{
   document.getElementById("msg").innerText="🔥 KEY COPIED SUCCESSFULLY 🔥";
   setTimeout(()=>document.getElementById("msg").innerText="",2000);
 });
}
</script>
</body>
</html>
