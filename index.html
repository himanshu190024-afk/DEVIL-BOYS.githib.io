<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DEVIL KEY</title>
<style>
    * { box-sizing: border-box; }
    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background:
            radial-gradient(circle at 50% 35%, #3a0000 0%, #120000 35%, #050505 75%);
        font-family: Arial, Helvetica, sans-serif;
        color: #fff;
        overflow: hidden;
    }

    .card {
        width: min(92%, 520px);
        padding: 34px 24px;
        text-align: center;
        border: 1px solid #ff1a1a;
        border-radius: 18px;
        background: rgba(10, 0, 0, 0.88);
        box-shadow: 0 0 18px #ff0000, inset 0 0 25px rgba(255,0,0,.15);
    }

    .devil {
        font-size: 64px;
        line-height: 1;
        filter: drop-shadow(0 0 12px red);
        margin-bottom: 8px;
    }

    h1 {
        margin: 0 0 8px;
        color: #ff2020;
        font-size: 30px;
        letter-spacing: 5px;
        text-shadow: 0 0 12px red;
    }

    .subtitle {
        color: #aaa;
        font-size: 13px;
        margin-bottom: 24px;
        letter-spacing: 2px;
    }

    .key-box {
        padding: 16px;
        border-radius: 10px;
        border: 1px dashed #ff3333;
        background: #080808;
        color: #ff4b4b;
        font-size: 16px;
        line-height: 1.5;
        word-break: break-all;
        box-shadow: inset 0 0 15px rgba(255,0,0,.12);
        margin-bottom: 18px;
        user-select: all;
    }

    button {
        width: 100%;
        border: 0;
        border-radius: 10px;
        padding: 14px 20px;
        font-size: 16px;
        font-weight: bold;
        letter-spacing: 2px;
        color: #fff;
        background: linear-gradient(135deg, #ff0000, #850000);
        cursor: pointer;
        box-shadow: 0 0 15px rgba(255,0,0,.65);
        transition: .2s;
    }

    button:hover {
        transform: translateY(-2px);
        box-shadow: 0 0 25px rgba(255,0,0,.9);
    }

    button:active { transform: scale(.98); }

    #status {
        height: 18px;
        margin-top: 12px;
        color: #ff5555;
        font-size: 13px;
    }
</style>
</head>
<body>

<div class="card">
    <div class="devil">😈</div>
    <h1>DEVIL KEY</h1>
    <div class="subtitle">SECRET ACCESS TOKEN</div>

    <div class="key-box" id="key">
        hdjskajsbvdvfbskoaoaowjebfbndks lakhs
    </div>

    <button onclick="copyKey()">⚡ COPY KEY ⚡</button>
    <div id="status"></div>
</div>

<script>
function copyKey() {
    const key = document.getElementById("key").innerText.trim();

    navigator.clipboard.writeText(key).then(() => {
        document.getElementById("status").innerText = "✓ KEY COPIED";
    }).catch(() => {
        const temp = document.createElement("textarea");
        temp.value = key;
        document.body.appendChild(temp);
        temp.select();
        document.execCommand("copy");
        temp.remove();
        document.getElementById("status").innerText = "✓ KEY COPIED";
    });
}
</script>

</body>
</html>
