<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KEY • DEVIL</title>
<style>
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
  font-family:Arial,Helvetica,sans-serif; color:#fff; overflow:hidden;
  background:
    radial-gradient(circle at 50% 45%,#3a0000 0,#160000 32%,#050505 70%),
    #050505;
}
body:before{
  content:""; position:fixed; inset:0; pointer-events:none; opacity:.18;
  background:repeating-linear-gradient(0deg,transparent 0 3px,#ff0000 4px);
}
.card{
  width:min(92%,520px); padding:34px 26px 30px; text-align:center;
  border:1px solid #ff2222; border-radius:22px;
  background:rgba(10,0,0,.88);
  box-shadow:0 0 18px #ff0000, inset 0 0 35px rgba(255,0,0,.12);
}
h1{
  margin:0 0 8px; color:#ff2020; letter-spacing:8px; font-size:42px;
  text-shadow:0 0 8px #f00,0 0 25px #900;
}
.sub{color:#aaa; margin-bottom:25px; letter-spacing:3px}
.key{
  display:flex; align-items:center; gap:10px; padding:15px;
  border:1px solid #6e1111; border-radius:12px; background:#080808;
}
#key{
  flex:1; min-width:0; color:#ff3b3b; font-size:15px; font-weight:bold;
  word-break:break-all; text-align:left; user-select:all;
}
button{
  border:0; border-radius:10px; padding:12px 18px; cursor:pointer;
  color:#fff; background:#c40000; font-weight:bold; letter-spacing:1px;
  box-shadow:0 0 12px rgba(255,0,0,.7); transition:.2s;
}
button:hover{background:#ff1111; transform:scale(1.04)}
#msg{height:20px;margin-top:16px;color:#ff5555;font-size:13px}
</style>
</head>
<body>
  <div class="card">
    <h1>DEVIL</h1>
    <div class="sub">ACCESS KEY</div>

    <div class="key">
      <div id="key">JHDJSKWNBDHIKSBTVVDGAYIQKRB</div>
      <button onclick="copyKey()">COPY</button>
    </div>

    <div id="msg"></div>
  </div>

<script>
function copyKey(){
  const key = document.getElementById("key").textContent.trim();
  navigator.clipboard.writeText(key).then(()=>{
    document.getElementById("msg").textContent = "✓ KEY COPIED";
  }).catch(()=>{
    const t=document.createElement("textarea");
    t.value=key; document.body.appendChild(t); t.select();
    document.execCommand("copy"); t.remove();
    document.getElementById("msg").textContent = "✓ KEY COPIED";
  });
}
</script>
</body>
</html>
