<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DEVIL KEY</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    font-family:Arial,Helvetica,sans-serif;color:#fff;
    background:
      radial-gradient(circle at 50% 35%,#3a0000 0,#150000 35%,#050505 75%);
    overflow:hidden;
  }
  body:before{
    content:"";position:fixed;inset:0;pointer-events:none;opacity:.18;
    background:repeating-linear-gradient(0deg,transparent 0 3px,#ff2020 4px);
  }
  .card{
    width:min(92%,560px);padding:34px 26px;border:1px solid #ff1e1e;
    border-radius:22px;text-align:center;background:rgba(10,5,5,.88);
    box-shadow:0 0 25px #ff000055,0 0 80px #ff000022;
    position:relative;
  }
  .devil{font-size:54px;filter:drop-shadow(0 0 12px #f00);margin-bottom:4px}
  h1{
    font-size:32px;letter-spacing:7px;color:#ff3131;
    text-shadow:0 0 10px #f00,0 0 25px #700;
  }
  .sub{margin:10px 0 24px;color:#aaa;letter-spacing:2px;font-size:12px}
  .keybox{
    display:flex;align-items:center;gap:10px;padding:14px;
    border:1px solid #4b1616;border-radius:14px;background:#090909;
  }
  #key{
    flex:1;word-break:break-all;text-align:left;color:#ff7777;
    font-family:monospace;font-size:14px;line-height:1.5;
  }
  button{
    border:0;border-radius:11px;padding:12px 18px;font-weight:800;
    color:#fff;background:linear-gradient(135deg,#ff2020,#8b0000);
    cursor:pointer;box-shadow:0 0 15px #f0000055;transition:.2s;
  }
  button:hover{transform:translateY(-2px);box-shadow:0 0 24px #f0000099}
  #msg{height:20px;margin-top:16px;color:#ff4b4b;font-size:13px}
  .line{height:1px;background:#3a1111;margin:22px 0 15px}
  .footer{font-size:11px;color:#666;letter-spacing:2px}
</style>
</head>
<body>
  <main class="card">
    <div class="devil">😈</div>
    <h1>DEVIL KEY</h1>
    <div class="sub">YOUR ACCESS KEY</div>

    <div class="keybox">
      <div id="key">hjdisjbdhfhoandbbchixisjebjfifojsbehfjdijs</div>
      <button id="copyBtn" onclick="copyKey()">COPY</button>
    </div>

    <div id="msg"></div>
    <div class="line"></div>
    <div class="footer">⚡ DEVIL ACCESS • KEEP YOUR KEY SAFE ⚡</div>
  </main>

<script>
async function copyKey(){
  const key = document.getElementById("key").textContent.trim();
  const btn = document.getElementById("copyBtn");
  try{
    await navigator.clipboard.writeText(key);
  }catch(e){
    const ta=document.createElement("textarea");
    ta.value=key; document.body.appendChild(ta);
    ta.select(); document.execCommand("copy"); ta.remove();
  }
  btn.textContent="COPIED ✓";
  document.getElementById("msg").textContent="Key copied successfully!";
  setTimeout(()=>{
    btn.textContent="COPY";
    document.getElementById("msg").textContent="";
  },1800);
}
</script>
</body>
</html>
