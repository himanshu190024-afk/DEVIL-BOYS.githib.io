<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DEVIL KEY</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at 50% 35%, #2b0000 0, #100000 35%, #030303 75%);
      color: #fff;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    .card {
      width: min(92%, 520px);
      padding: 34px 24px;
      text-align: center;
      border: 1px solid #8b0000;
      border-radius: 22px;
      background: rgba(12, 0, 0, .92);
      box-shadow: 0 0 35px rgba(255, 0, 0, .28), inset 0 0 25px rgba(180, 0, 0, .12);
    }

    .devil {
      font-size: 58px;
      margin-bottom: 8px;
      filter: drop-shadow(0 0 12px #f00);
    }

    h1 {
      margin: 0 0 8px;
      color: #ff1a1a;
      letter-spacing: 6px;
      font-size: 34px;
      text-shadow: 0 0 12px #f00;
    }

    p {
      color: #aaa;
      margin: 0 0 24px;
    }

    .key-box {
      display: flex;
      gap: 10px;
      padding: 8px;
      border-radius: 14px;
      background: #080808;
      border: 1px solid #4d0000;
    }

    #key {
      flex: 1;
      min-width: 0;
      border: 0;
      outline: 0;
      background: transparent;
      color: #ff4b4b;
      font-size: 15px;
      padding: 12px 8px;
      font-weight: bold;
      text-align: center;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 0 18px;
      min-height: 44px;
      background: #b00000;
      color: white;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(255,0,0,.35);
      transition: .2s;
    }

    button:hover {
      background: #e00000;
      transform: scale(1.03);
    }

    #status {
      height: 22px;
      margin-top: 14px;
      color: #ff3333;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="devil">😈</div>
    <h1>DEVIL KEY</h1>
    <p>Your access key</p>

    <div class="key-box">
      <input id="key" value="dhjskwkwjebbdbfhjejwiowjrbb" readonly>
      <button onclick="copyKey()">COPY</button>
    </div>

    <div id="status"></div>
  </div>

  <script>
    function copyKey() {
      const key = document.getElementById("key").value;
      navigator.clipboard.writeText(key).then(() => {
        document.getElementById("status").textContent = "✓ KEY COPIED";
        setTimeout(() => {
          document.getElementById("status").textContent = "";
        }, 1800);
      });
    }
  </script>
</body>
</html>
