<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DEVIL KEY</title>
<style>
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
  font-family:Arial,sans-serif; color:#fff; background:
  radial-gradient(circle at 50% 20%,#5b0000 0,#210000 28%,#050505 70%);
  overflow:hidden;
}
body:before{
  content:""; position:fixed; inset:0; pointer-events:none;
  background:repeating-linear-gradient(135deg,transparent 0 12px,rgba(255,0,0,.035) 13px 14px);
}
.card{
  width:min(92%,520px); padding:38px 28px; text-align:center;
  background:rgba(10,10,10,.9); border:1px solid #8b0000;
  border-radius:18px; box-shadow:0 0 35px rgba(255,0,0,.25), inset 0 0 25px rgba(255,0,0,.06);
}
h1{
  margin:0 0 8px; font-size:42px; letter-spacing:8px;
  color:#ff2222; text-shadow:0 0 10px #f00,0 0 28px #900;
}
.subtitle{color:#aaa; margin-bottom:28px; letter-spacing:3px}
.key{
  padding:18px 14px; border-radius:10px; background:#050505;
  border:1px solid #4d0000; color:#ff5a5a; word-break:break-all;
  font-family:monospace; font-size:17px; box-shadow:0 0 15px rgba(255,0,0,.15);
}
button{
  margin-top:22px; width:100%; padding:15px; border:0; border-radius:10px;
  background:linear-gradient(90deg,#780000,#e00000,#780000); color:white;
  font-size:17px; font-weight:bold; letter-spacing:3px; cursor:pointer;
  box-shadow:0 0 18px rgba(255,0,0,.3); transition:.2s;
}
button:hover{transform:scale(1.02); box-shadow:0 0 28px rgba(255,0,0,.55)}
#status{height:20px;margin-top:12px;color:#ff7777;font-size:13px}
</style>
</head>
<body>
  <div class="card">
    <h1>DEVIL</h1>
    <div class="subtitle">⚠ SECRET KEY ⚠</div>
    <div class="key" id="key">jdiaksjbdhdjskoaodjhfhfbrjrkr</div>
    <button onclick="copyKey()">☠ COPY KEY ☠</button>
    <div id="status"></div>
  </div>

<script>
function copyKey(){
  const key=document.getElementById("key").textContent;
  navigator.clipboard.writeText(key).then(()=>{
    document.getElementById("status").textContent="✓ KEY COPIED";
  }).catch(()=>{
    const t=document.createElement("textarea");
    t.value=key; document.body.appendChild(t); t.select();
    document.execCommand("copy"); t.remove();
    document.getElementById("status").textContent="✓ KEY COPIED";
  });
}
</script>
</body>
</html>
