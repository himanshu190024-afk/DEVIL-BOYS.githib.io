<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>DEVIL KEY PANEL</title>
<style>
body{margin:0;font-family:Arial;background:linear-gradient(135deg,#000,#220000,#550000);display:flex;justify-content:center;align-items:center;height:100vh}
.card{max-width:450px;width:90%;background:#111;border:2px solid red;border-radius:20px;padding:30px;text-align:center;box-shadow:0 0 30px red}
h1{color:#ff2222}.key{background:#1c1c1c;color:#00ff88;padding:15px;border:1px solid red;border-radius:10px;word-break:break-all}
button{margin-top:20px;width:100%;padding:15px;background:red;color:#fff;border:none;border-radius:10px;font-size:18px;cursor:pointer}
</style></head><body>
<div class="card"><h1>🔥 DEVIL KEY PANEL 🔥</h1>
<div class="key" id="key">DHAGUIEVCAFGHHWVHJEGVSKKBDV</div>
<button onclick="copyKey()">📋 COPY KEY</button></div>
<script>
function copyKey(){navigator.clipboard.writeText(document.getElementById('key').innerText);alert('Key Copied Successfully!');}
</script></body></html>
