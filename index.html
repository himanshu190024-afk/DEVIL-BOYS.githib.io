<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DEVIL KEY</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{min-height:100vh;display:flex;justify-content:center;align-items:center;background:#050505;color:#fff;overflow:hidden}
body:before{content:"";position:fixed;width:450px;height:450px;background:#f00;filter:blur(180px);opacity:.18;border-radius:50%}
.container{width:90%;max-width:500px;padding:35px 25px;text-align:center;background:rgba(15,15,15,.95);border:1px solid red;border-radius:20px;box-shadow:0 0 15px red,0 0 40px rgba(255,0,0,.3);position:relative;z-index:2}
.devil{font-size:60px;margin-bottom:10px;text-shadow:0 0 15px red}
h1{color:#ff1a1a;font-size:32px;letter-spacing:4px;text-shadow:0 0 12px red;margin-bottom:25px}
.label{color:#aaa;margin-bottom:10px;font-size:14px;letter-spacing:2px}
.key-box{background:#090909;border:1px solid #550000;border-radius:10px;padding:14px;margin-bottom:20px}
#key{color:#ff3333;font-size:14px;word-break:break-all;text-align:center}
button{width:100%;padding:14px;border:none;border-radius:10px;background:#d90000;color:#fff;font-size:16px;font-weight:bold;cursor:pointer;box-shadow:0 0 15px rgba(255,0,0,.5);transition:.2s}
button:hover{background:#f00;transform:scale(1.03);box-shadow:0 0 25px red}
#status{margin-top:15px;color:#00ff66;font-size:14px;min-height:18px}
.footer{margin-top:25px;color:#555;font-size:12px;letter-spacing:2px}
</style>
</head>
<body>
<div class="container">
<div class="devil">😈</div>
<h1>DEVIL KEY</h1>
<div class="label">YOUR KEY</div>
<div class="key-box"><div id="key">hdjsjakkjbvdvdjsklaoeorituwosbbdb</div></div>
<button onclick="copyKey()">COPY KEY</button>
<div id="status"></div>
<div class="footer">⚡ DEVIL ACCESS ⚡</div>
</div>
<script>
function copyKey(){
const key="hdjsjakkjbvdvdjsklaoeorituwosbbdb";
navigator.clipboard.writeText(key).then(()=>{
document.getElementById("status").innerText="✓ KEY COPIED SUCCESSFULLY";
}).catch(()=>{
document.getElementById("status").innerText="✕ COPY FAILED";
});
}
</script>
</body>
</html>
